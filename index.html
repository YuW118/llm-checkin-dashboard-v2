<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="cache-buster" content="1786742500">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>大模型学习打卡助手 · 新版</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
:root{
  --bg:#0a0a14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10); --txt:#e8ecf5; --mut:#8a92ad;
  --cyan:#22d3ee; --mag:#d946ef; --vio:#8b5cf6; --grn:#34d399; --red:#fb7185; --amb:#fbbf24;
  --sb:130px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:clip;overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--cyan)}
/* animated bg */
.bg-anim{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 15% 10%, rgba(34,211,238,.16), transparent 60%),
  radial-gradient(55% 45% at 85% 15%, rgba(217,70,239,.16), transparent 60%),
  radial-gradient(60% 55% at 50% 100%, rgba(139,92,246,.18), transparent 60%),
  #07070f;}
.bg-anim::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 80%)}
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:var(--sb);flex:0 0 var(--sb);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;padding:18px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border-right:1px solid var(--line);backdrop-filter:blur(14px);z-index:40}
.logo{font-weight:800;font-size:13px;line-height:1.3;text-align:center;margin:4px 0 14px;
  background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;
  color:var(--mut);font-size:11px;transition:.2s;border:1px solid transparent}
.nav button svg{width:24px;height:24px}
.nav button:hover{color:var(--txt);background:var(--panel)}
.nav button.on{color:#fff;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(217,70,239,.22));
  border-color:rgba(34,211,238,.4);box-shadow:0 0 18px rgba(34,211,238,.25)}
.sb-foot{margin-top:auto;font-size:9px;color:var(--mut);text-align:center;line-height:1.5}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.ham{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}
.ham svg{width:22px;height:22px}
.topbar h1{font-size:16px;margin:0;font-weight:700}
#view{padding:28px 20px;max-width:1080px;width:100%;margin:0 auto}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;
  backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card+h1,.block{margin-top:18px}
.h2{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.h2 .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--mag));box-shadow:0 0 10px var(--cyan)}
.row{display:flex;gap:14px;flex-wrap:wrap}
/* today panel */
.today{border:1px solid rgba(34,211,238,.3);background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(217,70,239,.06))}
.today ul{margin:6px 0 0;padding:0;list-style:none}
.today li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.today li:last-child{border-bottom:none}
/* motivation */
.moti{position:relative;overflow:hidden;border:1px solid rgba(217,70,239,.3);
  background:linear-gradient(135deg,rgba(217,70,239,.10),rgba(139,92,246,.08))}
.moti .big{font-size:clamp(20px,3.4vw,30px);font-weight:800;line-height:1.4;margin:6px 0 14px;
  background:linear-gradient(90deg,#fff,#cbe8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.motibtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--cyan),var(--vio));color:#06121a;box-shadow:0 4px 18px rgba(34,211,238,.3)}
.motibtn:active{transform:scale(.97)}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.stat .v{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:12px;color:var(--mut);margin-top:8px}
.stat .ic{position:absolute;right:10px;top:10px;width:30px;height:30px;opacity:.35}
.stat.c1 .v{color:var(--cyan)}.stat.c2 .v{color:var(--mag)}.stat.c3 .v{color:var(--grn)}.stat.c4 .v{color:var(--amb)}
/* module progress */
.mods{display:flex;flex-direction:column;gap:10px}
.mod{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);cursor:pointer;transition:.18s}
.mod:hover{background:var(--panel2);transform:translateX(2px)}
.mod .nm{width:150px;flex:0 0 150px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .track{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.mod .fill{height:100%;border-radius:6px;transition:width .6s}
.mod .pc{width:96px;flex:0 0 96px;text-align:right;font-size:12px;color:var(--mut)}
/* plan */
.plan-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{flex:1;min-width:180px;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);color:var(--txt);font-size:15px}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.btn{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--vio));color:#06121a;border:none}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.danger{color:var(--red);border-color:rgba(251,113,133,.4)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal .wd{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.cal .day{aspect-ratio:1/1;display:grid;place-items:center;font-size:13px;border-radius:11px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);position:relative;cursor:pointer}
.cal .day.sel{background:linear-gradient(135deg,var(--cyan),var(--vio));color:#06121a;font-weight:800;border:none}
.cal .day.hit::after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px var(--grn)}
.cal .day.dim{color:var(--mut);opacity:.4;cursor:default}
.cal .day.today{outline:2px solid var(--cyan)}
/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach .a{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center;opacity:.45;filter:grayscale(.6)}
.ach .a.un{opacity:1;filter:none;border-color:rgba(251,191,36,.4);box-shadow:0 0 16px rgba(251,191,36,.15)}
.ach .a .em{font-size:24px}
.ach .a .an{font-size:13px;font-weight:700;margin:6px 0 3px}
.ach .a .ad{font-size:11px;color:var(--mut);line-height:1.4}
/* learn */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tabs button{flex:0 0 auto;padding:8px 14px;border-radius:11px;font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tabs button.on{color:#fff;background:var(--panel2);border-color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.2)}
.tabs .mod-rename{flex:0 0 auto;padding:6px 10px;border-radius:9px;font-size:11px;
  background:rgba(255,255,255,.04);border:1px dashed var(--line);color:var(--mut);cursor:pointer}
.tabs .mod-rename:hover{color:var(--txt);border-color:var(--cyan)}
.grp{margin-bottom:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.grp.hidden-grp{opacity:.5}
.grp .gh{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap;
  background:linear-gradient(90deg,var(--gc,var(--cyan)),transparent)}
.grp .gh .gn{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gh .meta{font-size:11px;color:var(--mut);flex:0 0 auto}
.grp .gh .hug{font-size:18px;flex:0 0 auto;filter:grayscale(.2)}
.grp .gb{padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grp .gb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grp .gb{grid-template-columns:1fr}}
.course{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.18s;position:relative;cursor:pointer}
.course:hover{border-color:var(--cyan);background:rgba(255,255,255,.07)}
.course .c-num{position:absolute;top:-1px;left:12px;width:22px;height:22px;border-radius:6px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--mut);transform:translateY(-50%)}
.course .c-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:18px}
.course .cn{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course.done .cn{color:var(--mut);text-decoration:line-through}
.course .cm{font-size:11.5px;color:var(--mut)}
.course .cb{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid var(--mut);
  display:grid;place-items:center;transition:.18s}
.course.done .cb{background:linear-gradient(135deg,var(--grn),var(--cyan));border-color:transparent}
.course .cb svg{width:14px;height:14px;opacity:0;color:#06121a}
.course.done .cb svg{opacity:1}
.course .ced{display:none;gap:6px;flex:0 0 auto}
.edit .course .ced{display:flex}
.addcustom{display:none;grid-column:1/-1;gap:8px;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:12px}
.edit .addcustom{display:flex;flex-wrap:wrap}
.addcustom input{flex:1;min-width:120px;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt);font-size:13px}
.create-bar{display:none;gap:8px;align-items:center;padding:12px 16px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(217,70,239,.06));
  border:1px solid rgba(34,211,238,.25);border-radius:14px;flex-wrap:wrap}
.edit .create-bar{display:flex}
.create-bar .btn-sm{padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);cursor:pointer;transition:.15s}
.create-bar .btn-sm:hover{border-color:var(--cyan);background:rgba(34,211,238,.12)}
.create-bar .btn-sm.primary{border-color:var(--cyan);background:rgba(34,211,238,.15);color:var(--cyan)}
/* settings */
.set-sec{margin-bottom:18px}
.set-sec .h2{margin-bottom:10px}
.kv{display:flex;flex-direction:column;gap:10px}
.kv label{font-size:12px;color:var(--mut)}
.setrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.danger-zone{border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.05)}
/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;pointer-events:none;transition:.25s}
.mask.show{opacity:1;pointer-events:auto}
/* toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,35,.95);border:1px solid var(--line);padding:12px 20px;border-radius:12px;
  font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* pwa banner */
.pwabtn{display:none}
/* ============ 响应式布局 ============ */
/* 平板：课程网格 2 列 */
@media (max-width:900px){
  .grp .gb{grid-template-columns:repeat(2,1fr)}
  #view{max-width:100%}
}
/* 手机：侧栏变抽屉 + 汉堡菜单，导航纵向大按钮，进度行纵向堆叠 */
@media (max-width:768px){
  :root{--sb:0px;font-size:15px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;flex-basis:248px;
    transform:translateX(-100%);transition:transform .28s ease;z-index:45;box-shadow:0 0 50px rgba(0,0,0,.55)}
  .sidebar.open{transform:translateX(0)}
  .topbar{display:flex}
  .ham{width:44px;height:44px}
  .nav{flex-direction:column;gap:8px}
  .nav button{flex:1 1 auto;width:100%;min-height:50px;flex-direction:row;justify-content:flex-start;
    align-items:center;gap:12px;padding:12px 16px;font-size:14.5px;border-radius:13px}
  .nav button svg{width:22px;height:22px}
  #view{padding:18px 14px}
  .card{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat .v{font-size:24px}
  .mod{flex-wrap:wrap;gap:8px 12px;padding:12px 14px}
  .mod .nm{width:auto;flex:1 1 100%;font-size:14px}
  .mod .track{flex:1 1 100%}
  .mod .pc{width:auto;flex:1 1 100%;text-align:left;order:3}
  .grp .gb{grid-template-columns:repeat(2,1fr);gap:10px}
  .today li{font-size:14px}
  .moti .big{font-size:clamp(18px,5.5vw,26px)}
}
/* 小手机：课程单列，分组头换行，输入框与表单占满整行 */
@media (max-width:560px){
  #view{padding:14px 12px}
  .card{padding:14px}
  .grp .gb{grid-template-columns:1fr}
  .grp .gh{padding:12px 14px;gap:6px 10px}
  .grp .gh .gn{flex:1 1 100%}
  .grp .gh .meta{order:2;flex:0 0 auto}
  .grp .gh .hug{order:3;margin-left:auto}
  .course{padding:14px}
  .course .cn{font-size:14.5px;white-space:normal;line-height:1.4}
  .course .cm{font-size:12px}
  .course .c-num{width:20px;height:20px;font-size:10px}
  .course .cb{width:28px;height:28px;flex-basis:28px}
  .course .cb svg{width:16px;height:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .inp,.modal-inp,.setrow input,.setrow select,.addcustom input{min-width:0;width:100%}
  .setrow{flex-direction:column;align-items:stretch}
  .plan-head .btn,.toolbar .btn,.create-bar .btn-sm,.toolbar button{flex:1 1 auto}
  .cal{gap:4px}
  .cal .day{font-size:12px;border-radius:9px}
  .cal .wd{font-size:10px}
  .ach{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
}
/* 极窄屏：统计卡也单列，进一步收紧留白 */
@media (max-width:380px){
  #view{padding:12px 10px}
  .grp .gb,.stats{grid-template-columns:1fr}
  .stat .v{font-size:22px}
  .topbar{padding:10px 12px}
}
/* 桌面端细节增强 */
@media (min-width:769px){
  .sidebar{overflow-y:auto}
  #view{max-width:1080px}
}
/* ---------- 行内编辑 / 弹窗 ---------- */
.inline-edit{width:100%;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--cyan);color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.modal-root{display:none;position:fixed;inset:0;z-index:120}
.modal-mask{position:absolute;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(420px,92vw);background:linear-gradient(160deg,#12162a,#0b0e1c);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-h{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:16px}
.modal-msg{font-size:14px;color:var(--mut);margin-bottom:18px;line-height:1.6}
.modal-row{margin-bottom:13px}
.modal-row label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.modal-inp,.modal .inp{width:100%}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div id="storeWarn" style="display:none;padding:9px 16px;background:rgba(251,113,133,.16);border-bottom:1px solid rgba(251,113,133,.4);color:#fecdd3;font-size:13px;text-align:center;z-index:60;position:relative">⚠️ 当前打开方式无法保存学习进度（多为双击本地文件 / 隐私模式所致）。请用「本地服务器」或「部署到网页」后访问，本次数据仅临时有效。</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">大模型<br>学习打卡助手</div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">v5.1 · 数据存于本机<br>纯离线可用</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="ham" id="ham" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="ptitle">首页</h1>
    </header>
    <section id="view"></section>
  </div>
</div>
<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>

<script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const _LS=(function(){try{return window.localStorage;}catch(e){return null;}})();
const _mem={};let _noPersist=false;
try{_LS.setItem('__wbtest__','1');_LS.removeItem('__wbtest__');}catch(e){_noPersist=true;}
function lsGet(k){try{return _LS.getItem(k);}catch(e){return k in _mem?_mem[k]:null;}}
function lsSet(k,v){try{_LS.setItem(k,v);}catch(e){_mem[k]=v;}}
function lsDel(k){try{_LS.removeItem(k);}catch(e){delete _mem[k];}}
function load(k,def){try{const v=lsGet(k);if(v===null||v===undefined||v==='')return def;let p;try{p=JSON.parse(v);}catch(e){lsDel(k);return def;}
  if(def===null||def===undefined)return p;
  const isArr=Array.isArray(def),isObj=def&&typeof def==='object'&&!isArr;
  if(isArr){if(!Array.isArray(p)){lsDel(k);return def;}return p;}
  if(isObj){if(!p||typeof p!=='object'||Array.isArray(p)){lsDel(k);return def;}return Object.assign({},def,p);}
  if(typeof p!==typeof def){lsDel(k);return def;}return p;
}catch(e){return def;}}
function save(k,v){lsSet(k,JSON.stringify(v));}
function dateStr(d){d=d||new Date();const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function fmtMin(m){m=Math.round(m)||0;if(m<60)return m+'min';const h=Math.floor(m/60),r=m%60;return r?h+'h'+r+'m':h+'h';}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

(function repairStruct(){
  const valid=m=>m&&typeof m.name==='string'&&Array.isArray(m.groups)&&m.groups.every(g=>g&&Array.isArray(g.courses));
  if(!Array.isArray(COURSES)||!COURSES.length){COURSES=JSON.parse(JSON.stringify(DEFAULT_COURSES));lsDel(K.struct);return;}

})();

/* ============ 课程访问（含覆盖） ============ */
function gkey(mi,gi){return mi+'-'+gi;}
function grpName(mi,gi){return ov.grpRename[gkey(mi,gi)]||COURSES[mi].groups[gi].name;}
function grpHidden(mi,gi){return !!ov.grpHidden[gkey(mi,gi)];}
function courseName(c){return ov.courseRename[c.id]||c.name;}
function courseMin(c){return ov.courseDur[c.id]!=null?ov.courseDur[c.id]:c.m;}
/* 课程键：稳定唯一标识，用于定位/补充课程。内置课按 模块-分组-课id 推导；自定义课用存入的 key */
function courseKey(c,mi,gi){
  const arr=ov.custom[gkey(mi,gi)];
  if(arr){const e=arr.find(x=>x.id===c.id);if(e&&e.key)return e.key;}
  return 'M'+mi+'-G'+gi+'-C'+c.id;
}
function findCourseLoc(cid){
  for(let mi=0;mi<COURSES.length;mi++)for(let gi=0;gi<COURSES[mi].groups.length;gi++){
    const c=COURSES[mi].groups[gi].courses.find(x=>x.id===cid);
    if(c)return {c,mi,gi};
    const e=customOf(mi,gi).find(x=>x.id===cid);
    if(e)return {c:e,mi,gi};
  }
  return {c:{name:''},mi:curMod,gi:0};
}
function customOf(mi,gi){return ov.custom[gkey(mi,gi)]||[];}
function effCourses(mi,gi){
  const base=COURSES[mi].groups[gi].courses;
  return base.concat(customOf(mi,gi));
}
function isDone(cid){return !!ck.done[cid];}
function totalCourseMin(){let s=0;for(const m of COURSES)for(const g of m.groups)for(const c of g.courses)s+=courseMin(c);return s;}

/* ============ 统计 ============ */
function stats(){
  let done=0,doneMin=0,todayMin=0,weekMin=0,monthMin=0;
  const now=new Date();const y=now.getFullYear(),mo=now.getMonth();
  const dow=(now.getDay()+6)%7;const wkStart=new Date(now);wkStart.setDate(now.getDate()-dow);wkStart.setHours(0,0,0,0);
  const monStart=new Date(y,mo,1);
  for(const m of COURSES)for(const g of m.groups)for(const c of g.courses){
    if(isDone(c.id)){done++;doneMin+=courseMin(c);
      const d=ck.at[c.id];if(d===dateStr())todayMin+=courseMin(c);
      const dt=new Date(d+'T00:00:00');
      if(dt>=wkStart)weekMin+=courseMin(c);
      if(dt.getFullYear()===y&&dt.getMonth()===mo)monthMin+=courseMin(c);
    }
  }
  return {done,doneMin,todayMin,weekMin,monthMin,total:730,totalMin:totalCourseMin()};
}
function streak(){
  const set=new Set(Object.values(ck.at||{}).filter(Boolean));
  if(!set.size)return 0;
  let d=new Date();
  if(!set.has(dateStr(d))&&!set.has(dateStr(new Date(d-864e5))))return 0;
  if(!set.has(dateStr(d)))d=new Date(d-864e5);
  let s=0;while(set.has(dateStr(d))){s++;d=new Date(d-864e5);}return s;
}

  }else plist+='<p style="color:var(--mut);font-size:13px;margin:8px 0">这一天还没有计划，添加一个吧～</p>';
  plist+='</div>';

  // 时长统计
  const tstat='<div class="stats" style="margin-top:18px">'+
    statCard('c1','今日时长',fmtMin(st.todayMin),'<circle cx="12" cy="12" r="9"/>')+
    statCard('c2','本周时长',fmtMin(st.weekMin),'<path d="M4 18V8M10 18V4M16 18v-6"/>')+
    statCard('c3','本月时长',fmtMin(st.monthMin),'<rect x="4" y="4" width="16" height="16" rx="2"/>')+
    statCard('c4','累计时长',fmtMin(st.doneMin),'<path d="M3 17l6-6 4 4 8-8"/>')+
    '</div>';

  // 成就
  const ach=achievements(st);

  return cal+plist+tstat+ag;
}

    {name:'三百里程碑',desc:'完成 300 门',un:st.done>=300},
    {name:'学海无涯',desc:'完成 500 门',un:st.done>=500},
    {name:'登顶大师',desc:'完成全部 730 门',un:st.done>=730},
    {name:'七日之约',desc:'连续打卡 7 天',un:streak()>=7},
    {name:'月月坚持',desc:'连续打卡 30 天',un:streak()>=30},
    {name:'十小时',desc:'累计学习 10 小时',un:st.doneMin>=600},
    {name:'五十小时',desc:'累计学习 50 小时',un:st.doneMin>=3000},

function shiftMonth(d){let [y,mo]=selDate.split('-').map(Number);mo+=d;if(mo<1){mo=12;y--;}if(mo>12){mo=1;y++;}selDate=y+'-'+String(mo).padStart(2,'0')+'-01';render();}

function pickDate(ds){selDate=ds;render();}
function addPlan(){const i=$('#planInp');const t=i.value.trim();if(!t){toast('请输入计划内容');return;}if(!pl[selDate])pl[selDate]=[];pl[selDate].push({id:Date.now(),text:t,done:false});persistPlan();render();}
function togglePlan(id){const a=pl[selDate];if(!a)return;const p=a.find(x=>x.id===id);if(p){p.done=!p.done;persistPlan();render();}}
function delPlan(id){const a=pl[selDate];if(!a)return;pl[selDate]=a.filter(x=>x.id!==id);persistPlan();render();}

function modName(mi){return ov.modRename[mi]||COURSES[mi].name;}
function learnBodyHTML(){
  let body='';
  const m=COURSES[curMod];
  for(let gi=0;gi<m.groups.length;gi++){
    if(grpHidden(curMod,gi)&&!editMode)continue;
    const gc=m.color;
    const cs=effCourses(curMod,gi);
    let tot=0,dn=0,tmin=0;cs.forEach(c=>{tot++;tmin+=c.m;if(isDone(c.id))dn++;});
    const gname=grpName(curMod,gi);
    let gh='<div class="gh" style="--gc:'+gc+'">'+
      '<span class="gn" style="color:'+gc+'">● '+esc(gname)+(grpHidden(curMod,gi)?' （已隐藏）':'')+'</span>'+
      '<span class="meta">'+dn+'/'+tot+' · 约'+fmtMin(tmin)+'</span>'+
      '<button class="hug" title="求安慰" onclick="event.stopPropagation();comfort('+gi+')">🤗 求安慰</button>'+
      (editMode?'<button class="btn sm" onclick="event.stopPropagation();renameGrp('+gi+')">✎ 编辑</button>'+
      '<button class="btn sm '+(grpHidden(curMod,gi)?'primary':'danger')+'" onclick="event.stopPropagation();toggleHide('+gi+')">'+(grpHidden(curMod,gi)?'显示':'隐藏')+'</button>'+
      '<button class="btn sm danger" onclick="event.stopPropagation();delGroup('+gi+')">删除</button>':'')+
      '</div>';
    let gb='<div class="gb">';
    let ci=0;
    cs.forEach(c=>{
      const done=isDone(c.id);
      const match=!learnSearch||courseName(c).toLowerCase().includes(learnSearch.toLowerCase());
      if(!match)return;
      if(learnFilter==='done'&&!done)return;
      if(learnFilter==='undone'&&done)return;
      ci++;
      gb+='<div class="course'+(done?' done':'')+'" data-cid="'+c.id+'" onclick="toggleCourse('+c.id+')">'+
        '<span class="c-num">'+ci+'</span>'+
        '<div class="c-body">'+
        '<div class="cn">'+esc(courseName(c))+'</div>'+
        '<div class="cm">'+fmtMin(courseMin(c))+'</div>'+
        '</div>'+
        '<div class="cb" onclick="event.stopPropagation();toggleCourse('+c.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>'+
        (editMode?'<div class="ced" onclick="event.stopPropagation()"><button class="btn sm" onclick="editCourse('+c.id+')">✎ 编辑</button><button class="btn sm danger" onclick="delCourse('+c.id+')">删</button></div>':'')+
        '</div>';
    });
    if(editMode){
      gb+='<div class="addcustom"><input placeholder="新课程名" id="cn'+gi+'"/><input placeholder="课程键(可选)" id="ck'+gi+'" style="max-width:120px"/><input placeholder="分钟" type="number" min="1" id="cm'+gi+'" style="max-width:90px"/><button class="btn sm primary" onclick="addCustom('+gi+')">添加</button></div>';
    }
    gb+='</div>';
    if(gb.includes('class="course"')||editMode)body+='<div class="grp'+(grpHidden(curMod,gi)?' hidden-grp':'')+'" data-gi="'+gi+'">'+gh+gb+'</div>';
  }
  if(!body&&learnSearch)body='<div style="text-align:center;padding:40px 0;color:var(--mut);font-size:14px">没有找到匹配「<b style="color:var(--txt)">'+esc(learnSearch)+'</b>」的课程</div>';
  return body;
}
function refreshLearnBody(){const lb=document.getElementById('learnBody');if(lb)lb.innerHTML=learnBodyHTML();}
function switchMod(mi){curMod=mi;render();}

/* ---- 三级改名（行内编辑，避免被预览环境拦截的 prompt） ---- */
function findCourse(cid){for(const m of COURSES)for(const g of m.groups)for(const c of g.courses)if(c.id===cid)return c;return {name:''};}
function inlineEdit(el,val,onSave){
  if(!el)return;
  el.innerHTML='<input class="inline-edit" value="'+esc(val)+'"/>';
  const inp=el.querySelector('.inline-edit');
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.focus();inp.select();
  let done=false;
  function commit(){if(done)return;done=true;const v=inp.value.trim();if(v)onSave(v);else render();}
  function cancel(){if(done)return;done=true;render();}
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='Escape'){e.preventDefault();cancel();}});
  inp.addEventListener('blur',commit);
}
function renameMod(mi){const el=document.querySelector('.tabs button.on');inlineEdit(el,modName(mi),v=>{ov.modRename[mi]=v;persistOV();render();});}
function renameGrp(gi){const grp=document.querySelector('.grp[data-gi="'+gi+'"]');const el=grp?grp.querySelector('.gn'):null;inlineEdit(el,grpName(curMod,gi),v=>{ov.grpRename[gkey(curMod,gi)]=v;persistOV();render();});}
function toggleHide(gi){const k=gkey(curMod,gi);if(grpHidden(curMod,gi))delete ov.grpHidden[k];else ov.grpHidden[k]=true;persistOV();render();}
function editCourse(cid){

    '<div style="font-size:12px;color:var(--mut);margin:10px 0 4px">名称</div>'+

    '<div style="font-size:12px;color:var(--mut);margin:10px 0 4px">时长（分钟）</div>'+
    '<input class="inp modal-inp" id="ecMin" type="number" min="1" value="'+esc(String(min))+'"/>'+
    '<div class="modal-btns"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCourse('+cid+')">保存</button></div>'

function saveCourse(cid){

/* ---- 弹窗工具（替代被预览环境拦截的 prompt/confirm） ---- */
function openModal(html,onMount){
  const r=document.getElementById('modalRoot');
  r.innerHTML='<div class="modal-mask" onclick="modalClick(event)"><div class="modal" onclick="event.stopPropagation()">'+html+'</div></div>';
  r.style.display='block';
  if(onMount)onMount(r.querySelector('.modal'));
}
function modalClick(e){if(e.target.classList.contains('modal-mask'))closeModal();}
function closeModal(){const r=document.getElementById('modalRoot');r.style.display='none';r.innerHTML='';}
let _askCb=null,_confCb=null;
function askText(title,def,cb){_askCb=cb;openModal('<div class="modal-h">'+esc(title)+'</div><input class="inp modal-inp" id="mtInp" value="'+esc(def||'')+'" /><div class="modal-btns"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="askOk()">确定</button></div>',function(m){const i=m.querySelector('#mtInp');i.focus();i.select();i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();askOk();}else if(e.key==='Escape'){closeModal();}});});}
function askOk(){const v=document.getElementById('mtInp').value.trim();closeModal();const cb=_askCb;_askCb=null;if(cb)cb(v);}
function askConfirm(msg,cb){_confCb=cb;openModal('<div class="modal-h">请确认</div><div class="modal-msg">'+esc(msg)+'</div><div class="modal-btns"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="confOk()">确认</button></div>');}
function confOk(){closeModal();const cb=_confCb;_confCb=null;if(cb)cb();}

/* ---- 三级创建 ---- */
function addModule(){
  askText('输入新模型名称：','',v=>{
    v=(v||'').trim();
    if(!v){toast('名称不能为空');return;}
    if(v.length>30){toast('名称不超过30字');return;}
    const hues=[180,270,320,145,35,200,50];
    const h=hues[COURSES.length%hues.length];
    COURSES.push({name:v,color:'hsl('+h+',65%,60%)',bg:'hsla('+h+',65%,60%,.1)',groups:[]});
    toast('已添加模型「'+v+'」');curMod=COURSES.length-1;persistStruct();persistOV();render();
  });
}
function addGroup(){
  askText('为「'+modName(curMod)+'」添加新分组名称：','',v=>{
    v=(v||'').trim();
    if(!v){toast('名称不能为空');return;}
    if(v.length>30){toast('名称不超过30字');return;}
    COURSES[curMod].groups.push({name:v,courses:[]});
    toast('已添加分组「'+v+'」');persistStruct();persistOV();render();
  });
}
function quickAddCourse(){
  const m=COURSES[curMod];
  const opts=m.groups.map((g,i)=>'<option value="'+i+'">'+esc(grpName(curMod,i))+'</option>').join('');
  openModal('<div class="modal-h">添加课程到「'+esc(modName(curMod))+'」</div>'+
    '<div class="modal-row"><label>目标分组</label><select class="inp" id="qcGrp">'+opts+'</select></div>'+
    '<div class="modal-row"><label>课程名称</label><input class="inp" id="qcName" placeholder="如：项目介绍"/></div>'+
    '<div class="modal-row"><label>时长（分钟）</label><input class="inp" id="qcMin" type="number" min="1" value="10"/></div>'+
    '<div class="modal-btns"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="qcSubmit()">添加</button></div>',
    function(b){const n=b.querySelector('#qcName');n.focus();n.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();qcSubmit();}});});
}
function qcSubmit(){
  const gi=parseInt(document.getElementById('qcGrp').value);
  const n=document.getElementById('qcName').value.trim();
  const mm=Math.min(600,Math.max(1,parseInt(document.getElementById('qcMin').value)||10));
  closeModal();
  if(!n){toast('请输入课程名');return;}
  addCustomWithName(gi,n,Math.max(1,mm));
}
function addCustomWithName(gi,name,key,mins){
  mins=Math.min(600,Math.max(1,parseInt(mins)||10));
  if(name&&name.length>60){toast('课程名不超过60字');return;}
  let id=key?('k_'+key):('c_'+Date.now()+'_'+Math.floor(Math.random()*999));
  const k=gkey(curMod,gi);
  if(!ov.custom[k])ov.custom[k]=[];
  if(ov.custom[k].some(x=>x.id===id))id=id+'_'+Math.floor(Math.random()*999);
  const entry={id,name:name,m:mins};
  if(key)entry.key=key;
  ov.custom[k].push(entry);
  persistOV();toast('已添加课程「'+name+'」'+(key?'（键：'+key+'）':''));render();
}
function addCustom(gi){const n=$('#cn'+gi).value.trim(),kk=$('#ck'+gi).value.trim(),mm=$('#cm'+gi).value;if(!n){toast('请输入课程名');return;}addCustomWithName(gi,n,kk,Math.max(1,parseInt(mm)||10));$('#cn'+gi).value='';$('#ck'+gi).value='';$('#cm'+gi).value='';}

/* ---- 删除（仅自定义内容） ---- */
function delGroup(gi){
  const baseLen=COURSES[curMod].groups[gi].courses.length;
  if(baseLen>0){askConfirm('该分组包含 '+baseLen+' 门内置课程，删除后仍会保留（仅隐藏）。确认隐藏？',()=>{ov.grpHidden[gkey(curMod,gi)]=true;persistOV();toast('已隐藏该分组');render();});return;}
  ov.grpHidden[gkey(curMod,gi)]=true;persistOV();toast('已隐藏该分组');render();
}
function delCourse(cid){
  for(const mi in ov.custom){for(const gi in ov.custom[mi]){const arr=ov.custom[mi][gi];const idx=arr.findIndex(c=>c.id===cid);if(idx>=0){arr.splice(idx,1);persistOV();toast('已删除课程');render();return;}}}
  if(ck.done[cid]){delete ck.done[cid];delete ck.at[cid];persistCK();toast('已取消打卡');render();}
}
function toggleCourse(cid){
  if(ck.done[cid]){delete ck.done[cid];delete ck.at[cid];}else{ck.done[cid]=true;ck.at[cid]=dateStr();}
  persistCK();
  if(learnFilter!=='all'){refreshLearnBody();return;}
  const el=document.querySelector('.course[data-cid="'+cid+'"]');
  if(el)el.classList.toggle('done');
  const grp=el&&el.closest('.grp');
  if(grp){
    const gi=+grp.dataset.gi;
    let dn=0;effCourses(curMod,gi).forEach(c=>{if(isDone(c.id))dn++;});
    const tot=effCourses(curMod,gi).length;
    let tmin=0;effCourses(curMod,gi).forEach(c=>tmin+=courseMin(c));
    const meta=grp.querySelector('.gh .meta');if(meta)meta.textContent=dn+'/'+tot+' 门 · '+fmtMin(tmin);
  }
}
function comfort(gi){const gname=grpName(curMod,gi);const mname=modName(curMod);

  box.innerHTML='<div class="h2"><span class="dot"></span>🤗 '+esc(gname)+' · 来自小助手的安慰</div><div class="big" id="cf'+gi+'">正在为你准备温暖的话…</div>';
  $('#learnBody').prepend(box);
  callAI('你是陪伴学习大模型技术的暖心伙伴，用 2-3 句中文温柔安慰正在某个难点上受挫的学习者，具体提到他学的模型和分组，不要使用标点结尾也不要使用 emoji',
    '我正在学「'+mname+'」的「'+gname+'」部分，感觉有点难有点累，安慰我一下')
    .then(t=>{const el=document.getElementById('cf'+gi);if(el)el.textContent=t||rnd(QUOTES_COMF);});
}

function saveAI(){aicfg={url:$('#aiUrl').value.trim(),key:$('#aiKey').value.trim(),model:$('#aiModel').value};persistAI();toast('AI 配置已保存');}
function exportData(){const all={_app:'llm-checkin',_v:52,ck,pl,aicfg,ov};const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='llm-checkin-backup-'+dateStr()+'.json';a.click();toast('已导出备份');}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(d.ck){for(const k in d.ck.done)ck.done[k]=ck.done[k]||d.ck.done[k];for(const k in d.ck.at)ck.at[k]=ck.at[k]||d.ck.at[k];}
  if(d.pl){for(const k in d.pl)pl[k]=(pl[k]||[]).concat(d.pl[k].filter(x=>(pl[k]||[]).every(y=>y.id!==x.id)));}
  if(d.ov){ov.modRename=Object.assign(ov.modRename,d.ov.modRename||{});ov.grpRename=Object.assign(ov.grpRename,d.ov.grpRename||{});ov.grpHidden=Object.assign(ov.grpHidden,d.ov.grpHidden||{});ov.courseRename=Object.assign(ov.courseRename,d.ov.courseRename||{});ov.courseDur=Object.assign(ov.courseDur,d.ov.courseDur||{});ov.custom=Object.assign(ov.custom,d.ov.custom||{});}
  if(d.aicfg)aicfg=Object.assign(aicfg,d.aicfg);
  persistCK();persistPlan();persistOV();persistAI();toast('已合并导入');render();}catch(e){toast('导入失败：文件格式错误');}};r.readAsText(f);}
function restoreHidden(){ov.grpHidden={};persistOV();toast('已恢复所有隐藏分组');render();}
function clearSamples(){
  try{const sk=JSON.parse(lsGet('llm-seedkeys-v2')||'{}');
    for(const d in sk){(pl[d]||[]).forEach((_,i)=>{});if(pl[d]){pl[d]=pl[d].filter(p=>!sk[d].includes(p.id));if(!pl[d].length)delete pl[d];}}
  }catch(e){}
  lsDel('llm-seedkeys-v2');lsDel('llm-seeded-v2');persistPlan();toast('示例计划已清空');render();
}
function resetAll(){askConfirm('确定清空全部打卡、计划、配置与自定义数据？此操作不可恢复！',()=>{
  ['llm-v52','llm-plan-v52','llm-ai-cfg-v2','ov-v52','llm-seeded-v2',K.struct].forEach(k=>lsDel(k));
  ck={done:{},at:{}};pl={};aicfg={url:'',key:'',model:'gpt-4o-mini'};ov={grpRename:{},grpHidden:{},courseRename:{},courseDur:{},custom:{}};COURSES=JSON.parse(JSON.stringify(DEFAULT_COURSES));toast('已全部重置');render();
});}

/* ============ 事件绑定 ============ */
function bind(){
  $('#ham').onclick=openDrawer;
  $('#mask').onclick=closeDrawer;
}
/* PWA install */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.querySelector('.pwabtn');if(b){b.style.display='inline-block';b.onclick=()=>{deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>deferredPrompt=null);};}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

function fatalRecovery(){var ks=['llm-v52','llm-plan-v52','llm-ai-cfg-v2','ov-v52','llm-struct-v53','llm-seeded-v2','llm-seedkeys-v2'];ks.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});location.reload();}
try{buildNav();render();}catch(err){console.error('启动渲染失败，已进入数据恢复模式：',err);
  var v=document.getElementById('view');
  if(v){v.className='fatal';v.innerHTML='<div style="max-width:440px;margin:12vh auto;padding:28px 24px;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;font-family:system-ui,sans-serif;color:#222"><div style="width:54px;height:54px;line-height:54px;margin:0 auto 14px;border-radius:50%;background:#fff3e0;color:#e65100;font-size:28px;font-weight:700">!</div><h2 style="margin:0 0 10px;font-size:20px">本地数据异常</h2><p style="margin:0 0 18px;color:#666;font-size:14px;line-height:1.6">检测到本地存储中部分数据已损坏，导致页面无法正常显示。点击下方按钮可清除本地数据并恢复默认内容（已部署的版本不受影响）。</p><button class="btn primary" onclick="fatalRecovery()" style="font-size:15px;padding:11px 22px">清除本地数据并恢复</button><p style="margin:14px 0 0;color:#999;font-size:12px">若仍异常，请在浏览器开发者工具 → Application → Storage 中清除本站数据后重试。</p></div>';}
}
if(_noPersist){const sw=document.getElementById('storeWarn');if(sw)sw.style.display='block';}
